[project]
name = "russia-map-api"
version = "0.1.0"
description = "Application API for the Russia Map foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mapbox-vector-tile>=2.2,<3",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
