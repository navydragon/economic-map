name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          version: "0.12.5"
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest tests/test_health.py tests/test_railway_benchmark.py tests/test_road_benchmark.py tests/test_port_benchmark.py tests/test_waterway_fixture.py tests/test_waterway_benchmark.py -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: russia_map
      POSTGRES_USER: russia_map
      POSTGRES_PASSWORD: ci_test_only
      MARTIN_PORT: "3000"
      MARTIN_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          version: "0.12.5"
      - name: Install API test dependencies
        working-directory: apps/api
        run: uv sync --locked --group dev
      - name: Start PostGIS
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120 postgres
      - name: Migrate canonical schema
        working-directory: apps/api
        run: uv run --locked alembic upgrade head
      - name: Preserve unrelated OSM staging during railway import
        run: |
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
            -c 'CREATE SCHEMA staging_osm; CREATE TABLE staging_osm.sentinel (id integer PRIMARY KEY); INSERT INTO staging_osm.sentinel VALUES (1);'
      - name: Import synthetic OSM railway fixture
        working-directory: apps/api
        run: |
          uv run --locked python ../../pipelines/railways/import_railways.py import \
            --input ../../data/fixtures/osm/railways.osm \
            --source-slug ci-synthetic-railways \
            --source-name "CI synthetic railway fixture" \
            --source-url "https://github.com/navydragon/economic-map/blob/main/data/fixtures/osm/railways.osm" \
            --snapshot-at 2026-01-01T00:00:00+00:00 \
            --retrieved-at 2026-01-01T00:00:00+00:00
      - name: Import synthetic OSM road fixture
        working-directory: apps/api
        run: |
          uv run --locked python ../../pipelines/roads/import_roads.py import \
            --input ../../data/fixtures/osm/roads.osm \
            --source-slug ci-synthetic-roads \
            --source-name "CI synthetic road fixture" \
            --source-url "https://github.com/navydragon/economic-map/blob/main/data/fixtures/osm/roads.osm" \
            --snapshot-at 2026-01-01T00:00:00+00:00 \
            --retrieved-at 2026-01-01T00:00:00+00:00
      - name: Import synthetic OSM port fixture
        working-directory: apps/api
        run: |
          uv run --locked python ../../pipelines/ports/import_ports.py import \
            --input ../../data/fixtures/osm/ports.osm \
            --source-slug ci-synthetic-ports \
            --source-name "CI synthetic port fixture" \
            --source-url "https://github.com/navydragon/economic-map/blob/main/data/fixtures/osm/ports.osm" \
            --snapshot-at 2026-01-01T00:00:00+00:00 \
            --retrieved-at 2026-01-01T00:00:00+00:00
      - name: Import synthetic OSM waterway fixture
        working-directory: apps/api
        run: |
          uv run --locked python ../../pipelines/waterways/import_waterways.py import \
            --input ../../data/fixtures/osm/waterways.osm \
            --source-slug ci-synthetic-waterways \
            --source-name "CI synthetic waterway fixture" \
            --source-url "https://github.com/navydragon/economic-map/blob/main/data/fixtures/osm/waterways.osm" \
            --snapshot-at 2026-01-01T00:00:00+00:00 \
            --retrieved-at 2026-01-01T00:00:00+00:00
      - name: Start Martin
        run: docker compose up -d --wait --wait-timeout 120 martin
      - name: Wait for Martin sources
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "$MARTIN_URL/demo_sites" > /dev/null \
              && curl --fail --silent "$MARTIN_URL/railway_segments" > /dev/null \
              && curl --fail --silent "$MARTIN_URL/road_segments" > /dev/null \
              && curl --fail --silent "$MARTIN_URL/ports" > /dev/null \
              && curl --fail --silent "$MARTIN_URL/waterway_segments" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Martin sources did not become ready" >&2
          exit 1
      - name: Start FastAPI and wait for health
        working-directory: apps/api
        run: |
          uv run --locked uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$API_URL/health" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI did not become ready" >&2
          exit 1
      - name: Verify database, MVT, and API database health
        working-directory: apps/api
        run: uv run --locked pytest tests/test_integration.py tests/test_railway_integration.py tests/test_road_integration.py tests/test_road_benchmark_integration.py tests/test_port_integration.py tests/test_port_benchmark_integration.py tests/test_waterway_integration.py tests/test_waterway_benchmark_integration.py -q
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs postgres martin || true
          if [ -f "$RUNNER_TEMP/api.log" ]; then cat "$RUNNER_TEMP/api.log"; fi
      - name: Remove disposable infrastructure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" || true; fi
          docker compose down -v
