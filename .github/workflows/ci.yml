name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest tests/test_health.py -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: russia_map
      POSTGRES_USER: russia_map
      POSTGRES_PASSWORD: ci_test_only
      MARTIN_PORT: "3000"
      MARTIN_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        working-directory: apps/api
        run: uv sync --locked --group dev
      - name: Start PostGIS and Martin
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120 postgres martin
      - name: Wait for Martin source
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$MARTIN_URL/demo_sites" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Martin demo_sites source did not become ready" >&2
          exit 1
      - name: Start FastAPI and wait for health
        working-directory: apps/api
        run: |
          uv run --locked uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$API_URL/health" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI did not become ready" >&2
          exit 1
      - name: Verify database, MVT, and API database health
        working-directory: apps/api
        run: uv run --locked pytest tests/test_integration.py -q
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs postgres martin || true
          if [ -f "$RUNNER_TEMP/api.log" ]; then cat "$RUNNER_TEMP/api.log"; fi
      - name: Remove disposable infrastructure
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" || true; fi
          docker compose down -v
