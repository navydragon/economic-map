services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-russia_map}
      POSTGRES_USER: ${POSTGRES_USER:-russia_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1 FROM public.demo_sites LIMIT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config/config.yaml"]
    environment:
      MARTIN_DATABASE_URL: postgresql://${POSTGRES_USER:-russia_map}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-russia_map}
    ports:
      - "127.0.0.1:${MARTIN_PORT:-3000}:3000"
    volumes:
      - ./infra/martin/config.yaml:/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  osm2pgsql:
    profiles: [tools]
    image: iboates/osm2pgsql:2.3.1
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - type: bind
        source: ${OSM_INPUT_DIR:-./data/fixtures/osm}
        target: /input
        read_only: true
      - ./pipelines/railways/railways.lua:/config/railways.lua:ro
      - ./pipelines/roads/roads.lua:/config/roads.lua:ro
      - ./pipelines/ports/ports.lua:/config/ports.lua:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
